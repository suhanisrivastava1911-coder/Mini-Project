<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AI Scheme Sahayak</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <style>
    .auth-card-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: #F8FAFC;
    }
    .auth-box {
      max-width: 460px;
      width: 100%;
      background: #FFFFFF;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body style="background: #F8FAFC;">
  <div class="auth-card-wrapper">
    <div class="auth-box">
      <div class="text-center mb-4">
        <a href="/" class="brand-logo justify-center" style="margin-bottom: 0.75rem;">
          <div class="logo-mark">ASS</div>
          <span class="brand-title" style="font-size: 1.25rem;">AI Scheme Sahayak</span>
        </a>
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--navy-800); margin-top: 0.5rem; margin-bottom: 0.25rem;">
          Reset Your Password
        </h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Enter your registered email address to verify your account and set a new password.
        </p>
      </div>

      <div id="alert-box" class="alert hidden mb-3" style="border-radius: 8px; font-size: 0.9rem;"></div>

      <!-- Step 1: Request Token -->
      <form id="request-reset-form" novalidate>
        <div class="form-group mb-3">
          <label for="reset-email" class="form-label" style="font-weight: 600; color: var(--navy-800); font-size: 0.88rem;">
            Registered Email Address
          </label>
          <input 
            type="email" 
            id="reset-email" 
            class="form-input" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
            style="padding: 0.75rem 0.95rem; font-size: 0.95rem; border-radius: 8px;"
          >
        </div>
        <button 
          type="submit" 
          id="btn-request" 
          class="btn btn-primary btn-block btn-lg"
          style="padding: 0.8rem; font-size: 0.95rem; font-weight: 700; border-radius: 8px;"
        >
          Generate Reset Token &rarr;
        </button>
      </form>

      <!-- Step 2: Set New Password -->
      <form id="confirm-reset-form" class="hidden mt-4" novalidate>
        <div class="p-3 bg-light rounded text-xs mb-3" style="border: 1px solid var(--border-color); background: #EFF6FF; color: #1E40AF;">
          <strong>Recovery Code Generated:</strong> <code id="generated-token-display" style="font-weight: 700;"></code>
        </div>
        <div class="form-group mb-3">
          <label for="reset-token" class="form-label" style="font-weight: 600; color: var(--navy-800); font-size: 0.88rem;">
            Recovery Token
          </label>
          <input 
            type="text" 
            id="reset-token" 
            class="form-input" 
            placeholder="Paste reset token here" 
            required
            style="padding: 0.75rem 0.95rem; font-size: 0.95rem; border-radius: 8px;"
          >
        </div>
        <div class="form-group mb-3">
          <label for="new-password" class="form-label" style="font-weight: 600; color: var(--navy-800); font-size: 0.88rem;">
            New Password <span style="font-weight: 400; color: var(--text-muted);">(Min. 8 characters)</span>
          </label>
          <input 
            type="password" 
            id="new-password" 
            class="form-input" 
            placeholder="At least 8 characters with letters &amp; numbers"
            minlength="8" 
            required
            autocomplete="new-password"
            style="padding: 0.75rem 0.95rem; font-size: 0.95rem; border-radius: 8px;"
          >
        </div>
        <button 
          type="submit" 
          id="btn-confirm" 
          class="btn btn-success btn-block btn-lg"
          style="padding: 0.8rem; font-size: 0.95rem; font-weight: 700; border-radius: 8px;"
        >
          Set New Password &amp; Login &rarr;
        </button>
      </form>

      <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-color);">
        <p style="font-size: 0.9rem; color: var(--text-muted);">
          Remembered your credentials? 
          <a href="/pages/login.html" style="color: var(--primary-600); font-weight: 700; text-decoration: none;">
            Sign In here &rarr;
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const reqForm = document.getElementById('request-reset-form');
    const confForm = document.getElementById('confirm-reset-form');
    const alertBox = document.getElementById('alert-box');
    const btnRequest = document.getElementById('btn-request');

    function showAlert(msg, isSuccess = false) {
      alertBox.className = isSuccess ? 'alert alert-success' : 'alert alert-danger';
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    reqForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      const email = document.getElementById('reset-email').value.trim();
      if (!email) {
        showAlert('Please enter your email.');
        return;
      }

      btnRequest.disabled = true;
      btnRequest.textContent = 'Generating...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('Reset token generated! Copy the token below to set your new password.', true);
          confForm.classList.remove('hidden');
          document.getElementById('reset-token').value = data.reset_token || '';
          document.getElementById('generated-token-display').textContent = data.reset_token || 'TOKEN_SENT';
          reqForm.classList.add('hidden');
        } else {
          showAlert(data.error || 'Failed to process request. Please verify the email address.');
          btnRequest.disabled = false;
          btnRequest.textContent = 'Generate Reset Token →';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        btnRequest.disabled = false;
        btnRequest.textContent = 'Generate Reset Token →';
      }
    });

    confForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      const token = document.getElementById('reset-token').value.trim();
      const newPassword = document.getElementById('new-password').value;

      if (!token) {
        showAlert('Please provide the recovery token.');
        return;
      }
      if (newPassword.length < 8) {
        showAlert('New password must be at least 8 characters.');
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('Password reset successfully! Redirecting to login...', true);
          setTimeout(() => window.location.href = '/pages/login.html', 1200);
        } else {
          showAlert(data.error || 'Invalid or expired token.');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>

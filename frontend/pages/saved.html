<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Schemes &amp; Checklists | AI Scheme Sahayak</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="dashboard-layout">
  <!-- Top Nav -->
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand-logo">
        <div class="logo-mark">ASS</div>
        <div class="brand-text">
          <span class="brand-title">AI Scheme Sahayak</span>
          <span class="brand-sub">Bookmarked Schemes</span>
        </div>
      </a>

      <nav class="nav-menu">
        <a href="/pages/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/pages/schemes.html" class="nav-link">Explore Schemes</a>
        <a href="/pages/chat.html" class="nav-link">✨ AI Assistant</a>
        <a href="/pages/saved.html" class="nav-link active">Saved Schemes</a>
      </nav>

      <div class="header-actions">
        <a href="/pages/dashboard.html" class="btn btn-sm btn-outline">&larr; Back to Dashboard</a>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div class="card p-4 mb-4">
      <div class="flex-between align-center flex-wrap gap-2">
        <div>
          <h2 class="font-bold text-navy text-2xl">My Bookmarked Schemes &amp; Document Progress</h2>
          <p class="text-sm text-muted mt-1">Keep track of the schemes you want to apply for and your document collection progress.</p>
        </div>
        <a href="/pages/schemes.html" class="btn btn-primary btn-sm">+ Find More Schemes</a>
      </div>
    </div>

    <div id="saved-schemes-list" class="scheme-grid">
      <div class="card p-5 text-center text-muted" style="grid-column: 1 / -1;">Loading your saved schemes...</div>
    </div>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('saved-schemes-list');
      try {
        const res = await fetch('/api/schemes/saved');
        if (!res.ok) { window.location.href = '/pages/login.html'; return; }
        const data = await res.json();
        const saved = data.saved_schemes || [];

        if (saved.length === 0) {
          container.innerHTML = `
            <div class="card p-5 text-center text-muted" style="grid-column: 1 / -1;">
              <div class="text-4xl mb-2">📌</div>
              <h3 class="font-bold text-navy text-base">You haven't bookmarked any schemes yet</h3>
              <p class="text-xs text-muted mt-1">Browse verified government programs and bookmark them to track readiness.</p>
              <div class="mt-3">
                <a href="/pages/schemes.html" class="btn btn-outline btn-sm">Browse All Schemes &rarr;</a>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = saved.map(s => `
          <div class="scheme-card">
            <div>
              <div class="flex-between align-center mb-2">
                <span class="badge ${s.is_demo ? 'badge-warning' : 'badge-primary'}">${s.is_demo ? 'DEMO RECORD' : (s.authority_level || 'CENTRAL').toUpperCase()}</span>
                <span class="badge badge-light">${escapeHtml(s.status || 'Bookmarked')}</span>
              </div>
              <h3 class="scheme-title">${escapeHtml(s.scheme_name)}</h3>
              <p class="scheme-desc">${escapeHtml((s.scheme_description || '').substring(0, 130))}...</p>
            </div>
            <div>
              <div class="scheme-meta mb-3">
                <div><strong>Benefit:</strong> ${escapeHtml(s.benefit_type || 'Subsidy')}</div>
                <div><strong>Max Benefit:</strong> ₹${formatCurrency(s.max_benefit_amount)}</div>
              </div>
              <div class="flex-between gap-2">
                <a href="/pages/guidance.html?scheme_id=${s.scheme_id || s.id}" class="btn btn-primary btn-xs flex-grow text-center">Interactive Checklist &rarr;</a>
                <button class="btn btn-xs btn-danger btn-remove-saved" data-id="${s.scheme_id || s.id}">Remove</button>
              </div>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.btn-remove-saved').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const sid = e.target.dataset.id;
            await fetch(`/api/schemes/saved/${sid}`, { method: 'DELETE' });
            window.location.reload();
          });
        });
      } catch (e) {
        container.innerHTML = '<div class="alert alert-danger" style="grid-column: 1 / -1;">Error loading saved schemes.</div>';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }
    function formatCurrency(val) {
      if (!val) return 'Varies';
      const num = Number(val);
      if (num >= 10000000) return (num / 10000000).toFixed(1) + ' Crore';
      if (num >= 100000) return (num / 100000).toFixed(1) + ' Lakh';
      return num.toLocaleString('en-IN');
    }
  </script>
</body>
</html>
